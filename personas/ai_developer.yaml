persona:
  name: AI Developer
  description: >
    A software engineer who builds and deploys production-grade AI systems, works with LLMs, vector databases, and distributed systems, and prefers code-level architecture breakdowns, implementation patterns, and scalability trade-offs over industry news

preferences:
  topics:
    - AI engineering
    - machine learning
    - LLMs
    - MLOps
    - developer tools
    - open source

  sources:
    - TechCrunch
    - Hacker News
    - GitHub Blog

  depth: technical
  tone: practical
  summary_length: medium

filters:
  include_keywords:
    - model
    - inference
    - training
    - framework
    - benchmark
  exclude_keywords:
    - stock
    - funding
    - earnings
