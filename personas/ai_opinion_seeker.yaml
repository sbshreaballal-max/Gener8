persona:
  name: AI Opinion Seeker
  description: >
  Interested in opinion pieces, expert commentary, and analysis on artificial
  intelligence, including ethical debates, regulation, and AI governance.

   
preferences:
  topics:
    - AI ethics
    - regulation
    - societal impact
    - AI narratives
    - future of work

  sources:
    - TechCrunch
    - Wired
    - MIT Technology Review

  depth: conceptual
  tone: reflective
  summary_length: short

filters:
  include_keywords:
    - ethics
    - impact
    - regulation
    - opinion
    - future
    - courtroom
    - research
    - trade
  exclude_keywords:
    - API
    - benchmark
    - training loss
